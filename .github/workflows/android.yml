name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK (debug + release)
    # ubuntu-latest migrated to Ubuntu 26 on 2026-10-19 and the Android SDK setup
    # started failing there (~17 s into the job). Pin the known-good image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Fast Kotlin + resource checks (seconds, before the Gradle build)
        run: |
          python3 scripts/check-kotlin-syntax.py
          python3 scripts/check-android-resources.py

      - name: Set up Gradle (wrapper-driven, with dependency caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Build APKs, run unit tests (signed when secrets are present)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Important: capture Gradle's own exit code out of the pipeline. (An `|| true` after the
          # pipeline would reset PIPESTATUS, which previously hid real compiler failures.)
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          # Diagnostics are mirrored as ::error:: annotations: they stay readable in the run
          # summary and via the API even when log blobs are unavailable.
          if [ "$STATUS" -ne 0 ]; then
            echo "::group::Compiler diagnostics"
            grep -E "^(e: |w: .*warning)" build.log | head -n 80 || true
            echo "::endgroup::"
            grep -E "^e: " build.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=Kotlin::${line//%/％}"
            done
            grep -E "^\* What went wrong:" -A 8 build.log | head -n 20 | while IFS= read -r line; do
              echo "::error title=Gradle::${line//%/％}"
            done
            exit "$STATUS"
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          # Fail loudly with context instead of a bare `cp` error.
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error title=Missing debug APK::assembleDebug produced no app-debug.apk"
            find android/app/build/outputs -name '*.apk' || true
            exit 1
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SaliSurf-X-debug.apk
          RELEASE_APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1 || true)"
          if [ -z "$RELEASE_APK" ]; then
            echo "::error title=Missing release APK::assembleRelease produced no release APK"
            find android/app/build/outputs -name '*.apk' || true
            exit 1
          fi
          if echo "$RELEASE_APK" | grep -qi "unsigned"; then
            cp "$RELEASE_APK" dist/SaliSurf-X-release-unsigned.apk
            echo "Release APK is UNSIGNED (no signing secrets found)."
          else
            cp "$RELEASE_APK" dist/SaliSurf-X-release-signed.apk
            echo "Release APK is SIGNED with the repository keystore secret."
          fi
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: SaliSurf-X-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release metadata
        if: github.event_name == 'push'
        id: release_meta
        run: |
          # versionName is the single source of truth for the rolling release tag.
          VERSION="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error title=Version::could not read versionName from android/app/build.gradle.kts"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish APKs to a GitHub Release (main pushes and v* tags)
        # Every push to main publishes/updates the rolling release for the current
        # version; v* tags publish a release pinned to the tag. Bump versionName to
        # mint a fresh tag/release.
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: SaliSurf-X ${{ steps.release_meta.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
