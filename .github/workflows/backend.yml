name: Backend tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject declares >=3.10, and requirements-dev.lock carries per-version
      # markers: run all three so those lines are actually exercised.
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.lock
          pip install -r backend/requirements-build.lock
          SOURCE_DATE_EPOCH=1794182400 pip install --no-build-isolation --no-deps -e backend

      - name: "Static checks (ruff: syntax + undefined names)"
        run: ruff check backend

      - name: Run tests
        run: pytest backend/tests -q
