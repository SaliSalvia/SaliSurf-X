[build-system]
# Pinned exactly so wheel builds use the same setuptools version everywhere;
# the matching hash-verified lock is requirements-build.lock.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "subsurface-api"
version = "1.3.0"
description = "Evidence-aware geospatial workspace API for SaliSurf-X (region validation, Sentinel-2 catalog search, open-DEM terrain indicators, deep temporal pixel processing)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SaliSalvia and SaliSurf-X contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "shapely>=2.0",
  "requests>=2.32",
  "numpy>=1.26",
  "Pillow>=10.3",
  "tifffile>=2024.2.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["subsurface_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Syntax errors, undefined names and other correctness-only rules: fast and
# unambiguous enough to be a hard CI gate.
select = ["E9", "F"]
